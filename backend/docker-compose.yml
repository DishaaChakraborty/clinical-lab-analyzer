version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: clinical_lab_db
    environment:
      MYSQL_ROOT_PASSWORD: "ik Disha12@"
      MYSQL_DATABASE: clinical_lab
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical_lab_api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql+pymysql://root:ik Disha12@@mysql:3306/clinical_lab"
      HOST: "0.0.0.0"
      PORT: 8000
      DEBUG: "false"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./backend/ml/models:/app/backend/ml/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data: